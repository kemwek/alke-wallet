<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billetera - Depositar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
      body {
              padding: 20px;
              background-color:#212529;
      }

     .container {
        max-width: 400px;
        margin: 0 auto;
      }
      .btn {
              background-color: #fd7e14;
              color:white;
      }
      .btn.activo {
              background-color: white;
              color:black;
      }

  </style>
</head>
<body>
    <header>
    <div class="container">
        <nav class="navbar text-bg-light rounded-4">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <img src="./img/alkemy-logo.png" alt="Logo Alkemy" width="100" >
                </a>
                <span class="fs-3 fw-semibold">Wallet</span>
            </div>
        </nav>
    </div>
  </header>
  <section>
    <div class="container text-bg-dark">
      <h2>Depositar</h2>
      <form id="formDeposito">
        <div class="form-group">
          <label for="montoDeposito">Monto a depositar:</label>
          <input type="number" class="form-control" id="montoDeposito" placeholder="Ingrese monto">
        </div>
        <button type="submit" class="btn btn-primary">Realizar depósito</button>
      </form>
    
    </div>
  </section>
  <section>
    <div class="container text-bg-dark">
      <div class="card">
        <div class="card-header">
          Bienvenido, Admin
        </div>
        <div class="card-body">
          <h5 class="card-title"></h5>
          <p class="card-text">Tu saldo actual es:</p>
          <div class="mx-auto text-center">
            <h3 id="saldo">$60.000</h3>
          </div>          
        </div>
      </div>
    </div>   
  </section> 
  <br>
  <section>
        <div class="container text-bg-dark">
        <h5>¿Qué deseas hacer?</h5>
        <nav class="nav nav-pills flex-column flex-sm-row">

            <a class="btn btn-light flex-sm-fill text-sm-center activo"  aria-current="page" href="#">Inicio</a>


            <a class="btn btn-light flex-sm-fill text-sm-center" href="deposit.html">Depositar</a>

            <a class="btn btn-light flex-sm-fill text-sm-center" href="sendmoney.html">Enviar</a>

            <a class="btn btn-light flex-sm-fill text-sm-center" href="transactions.html">Movimientos</a>

        </nav>
    </div>
  </section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<script src="./js/script.js"></script>

</html>
