<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alke Wallet - Depositar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
  <header>
    <div class="container">
      <nav class="navbar bg-body-tertiary rounded-4">
        <div class="container">
          <a class="navbar-brand" href="#">
            <img src="./img/alkemy-logo.png" alt="Logo Alkemy" width="100">
          </a>
          <span class="fs-3 fw-semibold">Wallet</span>
        </div>
      </nav>
    </div>
  </header>
  <br>
  <main>
    <section>
      <div class="container text-bg-dark tarjeta-saldo">
        <div class="card">
          <div class="card-header">Bienvenido, <span id="nombre"></span> </div>
          <div class="card-body">
            <h5 class="card-title"></h5>
            <p class="card-text">Tu saldo actual es:</p>
            <div class="mx-auto text-center">
              <h3 id="saldo">$60.000</h3>
            </div>
          </div>
        </div>
      </div>
    </section>
    <br>
    <section>
      <div class="container div-seccion text-bg-dark">
        <h2>Depositar</h2>
        <form id="formDeposito">
          <div class="form-group">
            <label for="montoDeposito">Monto a depositar:</label>
            <input type="number" class="form-control" id="montoDeposito" placeholder="Ingrese monto">
          </div>
          <button type="submit" class="btn btn-light">Realizar depósito</button>
        </form>

      </div>
    </section>
    <br>
    <section>
      <div class="container text-bg-dark">
        <h5>¿Qué deseas hacer?</h5>
        <nav class="nav nav-pills flex-column flex-sm-row">

          <a class="btn btn-light flex-sm-fill text-sm-center" aria-current="page" href="menu.html">Inicio</a>


          <a class="btn btn-light flex-sm-fill text-sm-center activo" href="#">Depositar</a>

          <a class="btn btn-light flex-sm-fill text-sm-center" href="sendmoney.html">Enviar</a>

          <a class="btn btn-light flex-sm-fill text-sm-center" href="transactions.html">Movimientos</a>

        </nav>
      </div>
    </section>
  </main>

  <footer class="bg-body-tertiary text-center text-lg-start">

    <div class="text-center p-3 bg-body-tertiary">
      Proyecto realizado por Alejandro Fuentes con fines educativos
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="./js/script.js"></script>
</body>

</html>
