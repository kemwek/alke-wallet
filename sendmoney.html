<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billetera - Enviar Dinero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   

  <style>
    body {
      padding: 20px;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Enviar Dinero</h2>
    <form>
      <div class="form-group">
        <label for="searchContact">Buscar en la agenda de transferencias:</label>
        <input type="text" class="form-control" id="searchContact" placeholder="Buscar contacto">
        <button type="submit" class="btn btn-primary">Buscar contacto</button>
      </div>
    </form>
       <br>
       <form onsubmit="return false">
      <div class="form-group">
        <label class="form-label" for="nombre">Ingrese Nombre y Apellido:</label>
        <input type="text" class="form-control" id="nombre" placeholder="Nombre Apellido">
        
        <label class="form-label" for="cbu">Ingrese # Cuenta:</label>
        <input type="text" class="form-control" id="cuenta" placeholder="Ingrese # cuenta">
        
        <label class="form-label" for="alias">Ingrese alias:</label>
        <input type="text" class="form-control" id="alias" placeholder="Ingrese alias">

        <label class="form-label" for="banco">Ingrese Banco:</label>
        <input type="text" class="form-control" id="banco" placeholder="Ingrese Banco">

        <button type="submit" id="btnAgregaContacto" class="btn btn-secondary">Agregar nuevo contacto</button>
      </div>
      </form>
     
 <form>
     
 <h3>Contactos</h3>
  <ul id="contactList" class="list-group">
    <li class="list-group-item">
      <div class="contact-info">
        <span class="contact-name">John Doe</span>
        <span class="contact-details">CBU: 123456789, Alias: john.doe, Banco: ABC Bank</span>
      </div>
    </li>
    <li class="list-group-item">
      <div class="contact-info">
        <span class="contact-name">Jane Smith</span>
        <span class="contact-details">CBU: 987654321, Alias: jane.smith, Banco: XYZ Bank</span>
      </div>
    </li>
      <button type="submit" class="btn btn-primary">Enviar dinero</button>
    </form>
    <a href="menu.html" class="btn btn-secondary">Volver al Menú Principal</a>
  </div>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
   <script src="script.js"></script>
</body>
</html>
