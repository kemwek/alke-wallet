<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
    body {
      padding: 20px;
      background-color: black;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
    }
    .carousel-caption h5 {
      background-color: white;
      color:black;
    }
    .btn {
      background-color: #fd7e14;
      color:white;
    }
 
  </style>  
</head>
<body>
<header>
    <div class="container">
        <nav class="navbar bg-secondary-subtle rounded-4">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <img src="./img/alkemy-logo.png" alt="Logo Alkemy" width="100" >
                </a>
                <span class="fs-3 fw-semibold">Wallet</span>
            </div>
        </nav>
    </div>
</header>
<br>

<section>
    <div class="container">
        <div id="carouselInicio" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselInicio" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carouselInicio" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carouselInicio" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="./img/slide-alkewallet-1.png" class="imagen-carousel rounded-4 d-block w-100" alt="Persona con un teléfono móvil y una tarjeta en su mano">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>Optimizada para Móvil</h5>
                        <p>Accede a tu cuenta desde cualquier lado con tu teléfono móvil</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="./img/slide-alkewallet-2.png" class="imagen-carousel rounded-4 d-block w-100" alt="Teléfono móvil mostrando números y gráficos financieros">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>Tu cuenta fácil</h5>
                        <p>Revisa tu saldo, últimas transacciones y más</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="./img/slide-alkewallet-3.png" class="imagen-carousel rounded-4 d-block w-100" alt="Un candado sobre un computador portátil">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>100% Segura</h5>
                        <p>Tus datos están protegidos con tecnología de encriptación avanzada</p>
                    </div>
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselInicio" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselInicio" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Siguiente</span>
            </button>
        </div>
        <br>
        <br>
        <div class="col-6 mx-auto">
            <a class="btn" href="login.html">Ir a la página de Login</a>
        </div>

    
    </div>


</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="./js/script.js"></script>
</body>
</html>
